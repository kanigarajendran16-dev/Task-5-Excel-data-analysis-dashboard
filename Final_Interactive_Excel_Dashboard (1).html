
<!DOCTYPE html>

<html>

<head>

<title>Excel Data Analysis Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 25px;
}

h1 {
    text-align: center;
}

.filters {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 25px;
}

select {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #aaa;
    font-size: 15px;
}

.kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin: 20px;
}

.card {
    background: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.card h3 {
    margin: 5px;
}

.card p {
    font-size: 22px;
    font-weight: bold;
}

.charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    margin: 25px;
}

.chart-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

table {
    width: 95%;
    margin: 25px auto;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #333;
    color: white;
}

</style>

</head>


<body>

<h1>EXCEL DATA ANALYSIS DASHBOARD</h1>

</div>


<div class="card">

<h3>Total Quantity</h3>

</div>

</div>


<div class="charts">

<div class="chart-box">

<h2>Sales by Region</h2>

</div>


<div class="chart-box">

<h2>Sales by Category</h2>

<div class="chart-box">

<h2>Monthly Sales Trend</h2>

<canvas id="monthChart"></canvas>

</div>


<div class="chart-box">

<h2>Profit by Region</h2>

<canvas id="profitChart"></canvas>

</div>

</div>

let regionChart;
let categoryChart;
let monthChart;
let profitChart;


// ==========================================================
// CREATE DROPDOWN VALUES
// ==========================================================

const regions = [...new Set(data.map(x => x.Region))];

const categories = [...new Set(data.map(x => x.Category))];

const months = [
    "January","February","March","April",
    "May","June","July","August",
    "September","October","November","December"
];

regions.forEach(x => {

    let option = document.createElement("option");

    option.value = x;

    option.text = x;

    document.getElementById("regionFilter").appendChild(option);

});


categories.forEach(x => {

    let option = document.createElement("option");

    option.value = x;

    option.text = x;

    document.getElementById("categoryFilter").appendChild(option);

});


months.forEach(x => {

    let option = document.createElement("option");

    option.value = x;

    option.text = x;

    document.getElementById("monthFilter").appendChild(option);

});


// ==========================================================
// UPDATE DASHBOARD
// ==========================================================

function updateDashboard() {

    let region =
        document.getElementById("regionFilter").value;

    let category =
        document.getElementById("categoryFilter").value;

    let month =
        document.getElementById("monthFilter").value;


    let filtered = data.filter(row => {

        return (

            (region === "All" || row.Region == region)

            &&

            (category === "All" || row.Category == category)

            &&

            (month === "All" || row.Month == month)

        );

    });


    // ======================================================
    // KPI CALCULATIONS
    // ======================================================

    let totalSales =
        filtered.reduce((sum,row) =>
        sum + Number(row.Sales || 0),0);


    let totalProfit =
        filtered.reduce((sum,row) =>
        sum + Number(row.Profit || 0),0);


    let totalQuantity =
        filtered.reduce((sum,row) =>
        sum + Number(row.Quantity || 0),0);


    let totalOrders =
        new Set(filtered.map(row => row.Order_ID)).size;


    document.getElementById("sales").innerText =
        "₹" + totalSales.toLocaleString("en-IN");


    document.getElementById("profit").innerText =
        "₹" + totalProfit.toLocaleString("en-IN");


    document.getElementById("orders").innerText =
        totalOrders;


    document.getElementById("quantity").innerText =
        totalQuantity;


    // ======================================================
    // REGION SALES
    // ======================================================

    let regionData = {};


    filtered.forEach(row => {

        if (!regionData[row.Region])
            regionData[row.Region] = 0;

        regionData[row.Region] += Number(row.Sales || 0);

    });


    // ======================================================
    // CATEGORY SALES
    // ======================================================

    let categoryData = {};


    filtered.forEach(row => {

        if (!categoryData[row.Category])
            categoryData[row.Category] = 0;

        categoryData[row.Category] += Number(row.Sales || 0);

    });


    // ======================================================
    // MONTH SALES
    // ======================================================

    let monthData = {};


    filtered.forEach(row => {

        if (!monthData[row.Month])
            monthData[row.Month] = 0;

        monthData[row.Month] += Number(row.Sales || 0);

    });


    // ======================================================
    // REGION PROFIT
    // ======================================================

    let profitData = {};


    filtered.forEach(row => {

        if (!profitData[row.Region])
            profitData[row.Region] = 0;

        profitData[row.Region] += Number(row.Profit || 0);

    });


    // ======================================================
    // DESTROY OLD CHARTS
    // ======================================================

    if(regionChart) regionChart.destroy();

    if(categoryChart) categoryChart.destroy();

    if(monthChart) monthChart.destroy();

    if(profitChart) profitChart.destroy();


    // ======================================================
    // REGION CHART
    // ======================================================

    regionChart = new Chart(
        document.getElementById("regionChart"),
        {
            type: "bar",

            data: {
                labels: Object.keys(regionData),

                datasets: [{
                    label: "Sales",
                    data: Object.values(regionData)
                }]

            }
        }
    );


    // ======================================================
    // CATEGORY CHART
    // ======================================================

    categoryChart = new Chart(
        document.getElementById("categoryChart"),
        {
            type: "bar",

            data: {
                labels: Object.keys(categoryData),

                datasets: [{
                    label: "Sales",
                    data: Object.values(categoryData)
                }]

            }
        }
    );


    // ======================================================
    // MONTH CHART
    // ======================================================

    monthChart = new Chart(
        document.getElementById("monthChart"),
        {
            type: "line",

            data: {
                labels: Object.keys(monthData),

                datasets: [{
                    label: "Monthly Sales",
                    data: Object.values(monthData),
                    fill: false
                }]

            }
        }
    );


    // ======================================================
    // PROFIT CHART
    // ======================================================

    profitChart = new Chart(
        document.getElementById("profitChart"),
        {
            type: "bar",

            data: {
                labels: Object.keys(profitData),

                datasets: [{
                    label: "Profit",
                    data: Object.values(profitData)
                }]

            }
        }
    );


    // ======================================================
    // TABLE
    // ======================================================

    let tableHead =
        document.getElementById("tableHead");

    let tableBody =
        document.getElementById("tableBody");


    tableHead.innerHTML = "";

    tableBody.innerHTML = "";


    if(filtered.length > 0) {

        let columns = Object.keys(filtered[0]);

        let headerRow = "<tr>";

        columns.forEach(col => {

            headerRow += "<th>" + col + "</th>";

        });

        headerRow += "</tr>";

        tableHead.innerHTML = headerRow;


        filtered.forEach(row => {

            let tr = "<tr>";

            columns.forEach(col => {

                tr += "<td>" +
                    (row[col] ?? "") +
                    "</td>";

            });

            tr += "</tr>";

            tableBody.innerHTML += tr;

        });

    }

}


// ==========================================================
// INITIAL DASHBOARD
// ==========================================================

updateDashboard();

</script>
